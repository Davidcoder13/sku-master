<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SKU Scanner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='22' width='88' height='56' rx='6' fill='%23ffe14a' stroke='%23d7262e' stroke-width='8'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#ffffff; --ink:#1d2530; --muted:#667085; --line:#d9dde3; --wash:#f2f4f7;
  --red:#d7262e; --band:#ffe14a; --ok:#1a9d57;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 28px)}
main{max-width:560px;margin:0 auto}
h1{font-size:1.25rem;margin:14px 0 2px;letter-spacing:-.01em}
h2{font-size:1rem;margin:0}
.status{color:var(--muted);font-size:.9rem;min-height:1.3em}
.cam{position:relative;height:52dvh;margin:12px 0;background:#000;border-radius:10px;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#9aa4b2;font-size:.95rem}
#placeholder[hidden]{display:none}

/* result styled like the shelf label it reads */
.label{border:3px solid var(--red);border-radius:4px;background:var(--paper);overflow:hidden}
.label .band{background:var(--band);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cand{font:800 2.1rem/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.cand.ok{color:var(--ok)}
#crop{height:48px;max-width:42%;border:1px solid rgba(0,0,0,.25);background:#fff;image-rendering:auto}
.label .foot{padding:6px 14px;font-size:.85rem;color:var(--muted)}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--wash);color:var(--ink);cursor:pointer;min-height:44px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button[hidden]{display:none}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.check input{width:20px;height:20px}

input[type=search],textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:14px}
.set{display:flex;gap:10px;align-items:center;margin:8px 0;color:var(--muted)}.set input{flex:1}
dialog{border:3px solid var(--red);border-radius:6px;width:min(92vw,480px)}
dialog input{width:100%;margin:8px 0 0;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
summary{cursor:pointer;color:var(--muted);margin-top:6px}
.seg{display:flex;gap:6px;margin:12px 0 0}.seg button{flex:1}.seg button.on{background:var(--band);border-color:var(--red)}
.listhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px;gap:8px;flex-wrap:wrap}
.listhead .acts{display:flex;gap:6px}
.listhead button{padding:7px 12px;min-height:38px;font-size:.9rem}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
li .sku{font:700 1.15rem ui-monospace,"SF Mono",Menlo,Consolas,monospace;flex:1;text-align:left;
  background:none;border:0;padding:6px 0;min-height:40px}
li .when{color:var(--muted);font-size:.8rem}
li .del{background:none;border:0;color:var(--muted);padding:6px 10px;min-height:40px;font-size:1.2rem}
.empty{color:var(--muted);padding:14px 2px;border-bottom:1px solid var(--line)}
details{margin-top:18px;color:var(--muted);font-size:.85rem}
pre{white-space:pre-wrap;background:var(--wash);padding:10px;border-radius:8px;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <h1>SKU Scanner</h1>
  <div id="status" class="status">Tap Start camera to begin.</div>

  <section class="cam">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="placeholder">Camera is off</div>
  </section>

  <section class="label" aria-live="polite">
    <div class="band">
      <div id="cand" class="cand">&mdash;</div>
      <canvas id="crop" width="1" height="1"></canvas>
    </div>
    <div class="foot" id="foot">Waiting for a tag</div>
  </section>

  <div class="seg" id="modes">
    <button data-mode="scan" class="on">Scan</button>
    <button data-mode="build">Build list</button>
    <button data-mode="find">Find</button>
  </div>
  <div class="row">
    <button id="startBtn" class="primary">Start camera</button>
    <button id="torchBtn" hidden>Light</button>
    <button id="photoBtn">Scan a photo</button>
    <input type="file" id="photoIn" accept="image/*" hidden>
  </div>
  <details id="settings">
    <summary>Settings <span id="fps"></span></summary>
    <label class="set">Confidence <input type="range" id="confR" min="50" max="95" step="1"> <output id="confO"></output></label>
    <label class="set" id="zoomRow" hidden>Zoom <input type="range" id="zoomR"></label>
  </details>

  <input id="q" type="search" placeholder="Search SKUs in both lists" aria-label="Search SKUs">
  <div class="listhead">
    <h2>Hunt list <span id="huntCount"></span></h2>
    <div class="acts"><button id="huntCopy">Copy</button><button id="huntImport">Import</button><button id="huntClear">Clear</button></div>
  </div>
  <ul id="huntList"></ul>

  <div class="listhead">
    <h2>Scans <span id="count"></span></h2>
    <div class="acts">
      <button id="copyAll">Copy all</button>
      <button id="csvBtn">Save CSV</button>
      <button id="clearBtn">Clear</button>
    </div>
  </div>
  <ul id="list"></ul>

  <details><summary>What the reader saw</summary><pre id="raw">Nothing yet.</pre></details>
</main>
<dialog id="reviewDialog">
  <p>Review this detected item</p>
  <label>SKU
    <input id="reviewSku" type="text" inputmode="numeric" placeholder="1234-567">
  </label>
  <label>Price
    <input id="reviewPrice" type="text" inputmode="decimal" placeholder="36.99">
  </label>
  <div class="row"><button id="reviewConfirm" class="primary">Accept</button><button id="reviewIgnore">Skip</button></div>
</dialog>

<dialog id="imp">
  <p>Paste a list, one SKU and price per line, like 1866-265 36.99</p>
  <textarea id="impTxt" rows="8"></textarea>
  <div class="row"><button id="impGo" class="primary">Import</button><button id="impNo">Cancel</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js" crossorigin="anonymous"></script>
<script>
/*
  SKU Scanner: finds a shelf tag, crops the SKU corner, reads it with OCR.

  The tag is found by a YOLO model (best.onnx, run with ONNX Runtime Web). If the
  model is missing or fails to load, the older red-border finder is used instead.
  findTags() returns a list of {x, y, w, h} boxes in full-frame pixels.
*/
(() => {
'use strict';
const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
const statusEl = $('status'), candEl = $('cand'), footEl = $('foot'), cropPrev = $('crop'), rawEl = $('raw');
const startBtn = $('startBtn'), torchBtn = $('torchBtn');
const searchEl = $('q'), photoBtn = $('photoBtn'), photoIn = $('photoIn');
const listEl = $('list'), countEl = $('count'), huntEl = $('huntList'), huntCount = $('huntCount');

// Where the SKU sits inside the tag, as fractions of the tag box.
// Broader crop makes direct front-of-camera labels work much more reliably.
const REGION = { x0: 0.00, x1: 0.90, y0: 0.18, y1: 1.00 };
// SKU format: 4 digits, hyphen, 3 digits.
const STRICT = /(?:^|\D)(\d{4})\s*[-\u2013\u2014~]\s*(\d{3})(?!\d)/;
const LOOSE  = /(?:^|\D)(\d{4})[ \t]+(\d{3})(?!\d)/;   // OCR dropped the hyphen

function parseSku(text) {
  for (const line of text.split(/\n/)) {
    const m = STRICT.exec(line) || LOOSE.exec(line);
    if (m) return m[1] + '-' + m[2];
  }
  return null;
}

function scoreOcrText(text, kind) {
  const s = String(text || '').replace(/\s+/g, ' ').trim();
  if (!s) return 0;
  const digits = (s.match(/\d/g) || []).length;

  if (kind === 'sku') {
    const parsed = parseSku(s);
    if (parsed) {
      const hasDash = /\d{4}\s*[-\u2013\u2014~]\s*\d{3}/.test(s);
      const hasSpace = /\d{4}\s+\d{3}/.test(s);
      return Math.min(0.99, 0.55 + (hasDash ? 0.26 : 0) + (hasSpace ? 0.08 : 0) + Math.min(0.15, digits / 18));
    }
    if (/\d{4}/.test(s)) return Math.min(0.7, 0.32 + Math.min(0.25, digits / 20));
    return Math.min(0.4, digits / 20);
  }

  const parsed = parsePrice(s);
  if (parsed) {
    return Math.min(0.99, 0.62 + Math.min(0.25, digits / 14));
  }
  const looksPrice = /(\d+)[.,](\d{1,2})/.test(s) || /\d{3,4}/.test(s);
  return looksPrice ? Math.min(0.7, 0.28 + Math.min(0.25, digits / 18)) : Math.min(0.3, digits / 20);
}
function qualityLabel(score) {
  if (score == null || Number.isNaN(score)) return '—';
  return Math.max(0, Math.min(99, Math.round(score * 100))) + '%';
}
function getReadThreshold(kind) {
  return kind === 'sku'
    ? { accept: 0.78, retry: 0.64 }
    : { accept: 0.86, retry: 0.72 };
}
function getTrackState(t) {
  if (t && t.rejected) return { label: 'rejected', color: '#d7262e' };
  if (t && t.sku && (!t.price || t.price)) return { label: 'accepted', color: '#1a9d57' };
  return { label: 'pending', color: '#ffe14a' };
}

/* ---------- state ---------- */
let stream = null, track = null, running = false, ready = false, ocrPromise = null;
let worker = null, curPsm = '6', torchOn = false;
let hist = [], lastAccepted = null, lastTagSeen = 0, lastOcr = 0, flashUntil = 0;
let scans = [];
const frame = document.createElement('canvas');
const frameCtx = frame.getContext('2d');   // GPU canvas: faster to copy video into
const ocrCv = document.createElement('canvas');
const det = document.createElement('canvas');
const detCtx = det.getContext('2d', { willReadFrequently: true });

let lastStatus = '';
function setStatus(s) { if (s !== lastStatus) { statusEl.textContent = s; lastStatus = s; } }

/* ---------- tag detection: YOLO via ONNX Runtime Web ---------- */
const MODEL_URL = 'best.onnx';   // the exported model, next to index.html
let MODEL_SIZE = 640;            // fixed automatically if the model expects another size
let CONF_MIN = 0.55;             // allow lower-confidence tags so direct labels still get picked up
try { CONF_MIN = +localStorage.getItem('skuConf') || 0.55; } catch (e) {}
const TAG_CLASS = null;          // set to a class number to ignore the other classes
let inBuf = null, session = null, inputName = '', detState = 'idle', detPromise = null;
const lb = document.createElement('canvas'); lb.width = lb.height = MODEL_SIZE;
const lbCtx = lb.getContext('2d', { willReadFrequently: true });

function initDetector() {
  if (detPromise) return detPromise;
  detState = 'loading';
  detPromise = (async () => {
    if (!window.ort) throw new Error('onnxruntime-web did not load');
    const gpu = !!navigator.gpu;               // WebGPU is much faster when the phone has it
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.proxy = !gpu;                 // otherwise run the model off the main thread
    session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: gpu ? ['webgpu', 'wasm'] : ['wasm'] });
    inputName = session.inputNames[0];
    detState = 'ready';
  })().catch(e => { detState = 'failed'; console.error('Tag model failed, using the red-border finder', e); });
  return detPromise;
}

async function yoloDetect(src) {
  // letterbox the frame into a square, like Ultralytics does
  const r = Math.min(MODEL_SIZE / src.width, MODEL_SIZE / src.height);
  const nw = Math.round(src.width * r), nh = Math.round(src.height * r);
  const px = Math.floor((MODEL_SIZE - nw) / 2), py = Math.floor((MODEL_SIZE - nh) / 2);
  lbCtx.fillStyle = 'rgb(114,114,114)'; lbCtx.fillRect(0, 0, MODEL_SIZE, MODEL_SIZE);
  lbCtx.drawImage(src, 0, 0, src.width, src.height, px, py, nw, nh);
  const d = lbCtx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE).data;
  const plane = MODEL_SIZE * MODEL_SIZE, input = inBuf || (inBuf = new Float32Array(3 * plane));
  for (let i = 0, p = 0; i < plane; i++, p += 4) {
    input[i] = d[p] / 255; input[plane + i] = d[p + 1] / 255; input[2 * plane + i] = d[p + 2] / 255;
  }
  const out = await session.run({ [inputName]: new ort.Tensor('float32', input, [1, 3, MODEL_SIZE, MODEL_SIZE]) });
  const t = out[session.outputNames[0]], a = t.data, dims = t.dims;

  const cand = [];
  const consider = (x1, y1, x2, y2, conf, cls) => {
    if (conf < CONF_MIN || x2 <= x1 || y2 <= y1) return;
    if (TAG_CLASS !== null && cls !== TAG_CLASS) return;
    cand.push({ x1, y1, x2, y2, conf });
  };
  if (dims.length === 3 && dims[2] === 6 && dims[1] > 6) {
    // end-to-end output [1, 300, 6]: x1, y1, x2, y2, confidence, class (no NMS needed)
    for (let i = 0; i < dims[1]; i++) {
      const o = i * 6;
      consider(a[o], a[o + 1], a[o + 2], a[o + 3], a[o + 4], Math.round(a[o + 5]));
    }
  } else if (dims.length === 3) {
    // raw output [1, 4 + classes, boxes]: cx, cy, w, h, then one score per class
    const rowsFirst = dims[1] > dims[2];
    const nCh = rowsFirst ? dims[2] : dims[1], n = rowsFirst ? dims[1] : dims[2];
    const v = (c, i) => rowsFirst ? a[i * nCh + c] : a[c * n + i];
    for (let i = 0; i < n; i++) {
      let cls = 0, sc = 0;
      for (let c = 4; c < nCh; c++) { const s = v(c, i); if (s > sc) { sc = s; cls = c - 4; } }
      const cx = v(0, i), cy = v(1, i), w = v(2, i), h = v(3, i);
      consider(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2, sc, cls);
    }
  } else return null;
  // back to full-frame pixels, strongest first, dropping overlapping duplicates
  cand.sort((a, b) => b.conf - a.conf);
  const res = [];
  for (const c of cand) {
    const x1 = Math.max(0, (c.x1 - px) / r), y1 = Math.max(0, (c.y1 - py) / r);
    const x2 = Math.min(src.width, (c.x2 - px) / r), y2 = Math.min(src.height, (c.y2 - py) / r);
    const b = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    if (b.w < 20 || b.h < 20 || res.some(o => iou(o, b) > 0.5)) continue;
    res.push(b);
    if (res.length >= 12) break;
  }
  return res;
}

function mergeBoxes(boxes) {
  const merged = [];
  for (const box of boxes) {
    let added = false;
    for (const m of merged) {
      if (iou(m, box) > 0.45) {
        m.x = Math.min(m.x, box.x); m.y = Math.min(m.y, box.y);
        m.w = Math.max(m.x + m.w, box.x + box.w) - m.x;
        m.h = Math.max(m.y + m.h, box.y + box.h) - m.y;
        m.conf = Math.max(m.conf || 0, box.conf || 0);
        added = true; break;
      }
    }
    if (!added) merged.push({ ...box });
  }
  return merged.sort((a, b) => (b.conf || 0) - (a.conf || 0));
}

async function detectAtScale(src, scale) {
  const sw = Math.max(1, Math.round(src.width * scale));
  const sh = Math.max(1, Math.round(src.height * scale));
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(src, 0, 0, sw, sh);
  const boxes = await yoloDetect(c);
  if (!boxes) return [];
  return boxes.map(b => ({ x: b.x / scale, y: b.y / scale, w: b.w / scale, h: b.h / scale, conf: b.conf || CONF_MIN }));
}

async function findTags(src) {
  if (detState === 'loading') return [];
  if (detState === 'ready') {
    try {
      const scales = [0.75, 1, 1.45, 1.9];
      const all = [];
      for (const s of scales) {
        const hits = await detectAtScale(src, s);
        all.push(...hits);
      }
      const merged = mergeBoxes(all).filter(b => b.w > 20 && b.h > 20);
      return merged.slice(0, 12);
    }
    catch (e) {
      const m = /Expected: (\d+)/.exec(String((e && e.message) || e));
      if (m && +m[1] !== MODEL_SIZE) { MODEL_SIZE = +m[1]; lb.width = lb.height = MODEL_SIZE; inBuf = null; return []; }
      console.error(e); detState = 'failed';
    }
  }
  const tags = detectTags(src);        // model unavailable: red-border finder
  return tags;
}

/* ---------- OCR engine ---------- */
function initOcr() {
  if (ocrPromise) return ocrPromise;
  setStatus('Loading the text reader\u2026');
  ocrPromise = (async () => {
    if (!window.Tesseract) throw new Error('Tesseract did not load');
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789-',
      tessedit_pageseg_mode: '6',
      preserve_interword_spaces: '1'
    });
    ready = true;
    setStatus(running ? 'Point the camera at a tag.' : 'Text reader ready.');
  })().catch(e => {
    ocrPromise = null;
    setStatus('Could not load the text reader. Check your connection and reload.');
    console.error(e);
  });
  return ocrPromise;
}

/* ---------- fallback tag detection (red border, no ML) ---------- */
function detectTags(src) {
  const DW = 320, w = DW, h = Math.round(src.height * DW / src.width);
  det.width = w; det.height = h;
  detCtx.drawImage(src, 0, 0, w, h);
  const d = detCtx.getImageData(0, 0, w, h).data;
  const n = w * h, mask = new Uint8Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = d[p], g = d[p + 1], b = d[p + 2];
    if (r > 120 && r - g > 60 && r - b > 50) mask[i] = 1;
  }
  const m2 = new Uint8Array(n);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!mask[y * w + x]) continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < w && yy < h) m2[yy * w + xx] = 1;
    }
  }
  const seen = new Uint8Array(n), stack = new Int32Array(n);
  const boxes = [];
  for (let i = 0; i < n; i++) {
    if (!m2[i] || seen[i]) continue;
    let sp = 0, minX = w, minY = h, maxX = 0, maxY = 0, cnt = 0;
    stack[sp++] = i; seen[i] = 1;
    while (sp) {
      const k = stack[--sp], x = k % w, y = (k / w) | 0;
      cnt++;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (x > 0     && m2[k - 1] && !seen[k - 1]) { seen[k - 1] = 1; stack[sp++] = k - 1; }
      if (x < w - 1 && m2[k + 1] && !seen[k + 1]) { seen[k + 1] = 1; stack[sp++] = k + 1; }
      if (y > 0     && m2[k - w] && !seen[k - w]) { seen[k - w] = 1; stack[sp++] = k - w; }
      if (y < h - 1 && m2[k + w] && !seen[k + w]) { seen[k + w] = 1; stack[sp++] = k + w; }
    }
    const bw = maxX - minX + 1, bh = maxY - minY + 1, area = bw * bh, ar = bw / bh;
    // Allow more realistic label shapes so a directly held tag is not rejected.
    if (area < n * 0.01 || ar < 0.5 || ar > 4.0) continue;
    if (cnt / area > 0.7) continue;
    let sum = 0, c = 0;
    for (let y = minY + 3; y < maxY - 3; y += 3) for (let x = minX + 3; x < maxX - 3; x += 3) {
      const p = (y * w + x) * 4;
      sum += 0.3 * d[p] + 0.59 * d[p + 1] + 0.11 * d[p + 2]; c++;
    }
    if (!c || sum / c < 130) continue;
    boxes.push({ x: minX * (src.width / w), y: minY * (src.width / w), w: bw * (src.width / w), h: bh * (src.width / w), conf: 0.9 });
  }
  return mergeBoxes(boxes).slice(0, 12);
}

/* ---------- crop + clean up for OCR ---------- */
function prepare(src, tag, reg) {
  const x = tag.x + tag.w * reg.x0, y = tag.y + tag.h * reg.y0;
  const w = tag.w * (reg.x1 - reg.x0), h = tag.h * (reg.y1 - reg.y0);
  const target = 800;
  const sc = Math.min(2.5, Math.max(0.4, target / w));
  ocrCv.width = Math.max(1, Math.round(w * sc));
  ocrCv.height = Math.max(1, Math.round(h * sc));
  const c = ocrCv.getContext('2d', { willReadFrequently: true });
  c.imageSmoothingQuality = 'high';
  c.drawImage(src, x, y, w, h, 0, 0, ocrCv.width, ocrCv.height);
  // grayscale + contrast stretch
  const img = c.getImageData(0, 0, ocrCv.width, ocrCv.height), p = img.data;

}

function acceptReview() {

/* ---------- live camera loop ---------- */
async function tick() {

      ms = ms ? ms * 0.8 + (now - t0) * 0.2 : now - t0;

async function tuneCamera() {
  if (!track) return;
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const adv = [];
    if (caps.focusMode && caps.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
    if (caps.exposureMode && caps.exposureMode.includes('continuous')) adv.push({ exposureMode: 'continuous' });
    if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) adv.push({ whiteBalanceMode: 'continuous' });
    if (adv.length) await track.applyConstraints({ advanced: adv });
    if (caps.exposureCompensation) {
      const current = caps.exposureCompensation.default ?? 0;
      await track.applyConstraints({ advanced: [{ exposureCompensation: current }] });
    }
  } catch (e) {}
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('The camera needs a secure (https) page. Open the GitHub Pages link.');
    return;
  }
  startBtn.disabled = true;
  initOcr();
  initDetector();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false

  } catch (e) {
    setStatus('Camera blocked. Allow camera access for this page and try again.');
    startBtn.disabled = false;
    return;
  }
  video.srcObject = stream;
  await video.play();
  track = stream.getVideoTracks()[0];
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    }

    if (caps.zoom) { const z = $('zoomR'); z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1; z.value = caps.zoom.min; $('zoomRow').hidden = false; }
    await tuneCamera();

  setStatus(ready ? 'Point the camera at a tag.' : 'Loading the text reader\u2026');

}

function stopCamera() {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null; video.srcObject = null;
  tracks = []; octx.clearRect(0, 0, overlay.width, overlay.height);

startBtn.onclick = () => (running ? stopCamera() : startCamera());

  catch (e) { torchOn = false; }

function saveHunt() { try { localStorage.setItem('skuHunt', JSON.stringify(hunt)); } catch (e) {} }
function addHunt(it) {
  const old = hunt.find(h => h.sku === it.sku);
  if (old) { old.price = it.price; old.done = false; } else hunt.push(it);
  saveHunt(); renderHunt();
}
function renderHunt() {
  huntEl.textContent = '';
  const done = hunt.filter(h => h.done).length;
  huntCount.textContent = hunt.length ? '(' + done + ' of ' + hunt.length + ' done)' : '';
  if (!hunt.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = 'Choose Build list, then scan the new labels.'; huntEl.appendChild(li); return;
  }
  hunt.forEach((h, i) => {
    if (!hit(h.sku)) return;
    const li = document.createElement('li');
    const b = document.createElement('button'); b.className = 'sku';
    b.textContent = h.sku + '  ' + h.price + (h.done ? '  \u2713' : '');
    b.style.opacity = h.done ? 0.5 : 1; b.title = 'Tap to mark done or not done';
    b.onclick = () => { h.done = !h.done; saveHunt(); renderHunt(); };
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '\u00d7';
    del.setAttribute('aria-label', 'Remove ' + h.sku);
    del.onclick = () => { hunt.splice(i, 1); saveHunt(); renderHunt(); };
    li.append(b, del); huntEl.appendChild(li);
  });
}
$('huntClear').onclick = () => { if (hunt.length && confirm('Clear the hunt list?')) { hunt = []; saveHunt(); renderHunt(); } };
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
  tracks.forEach(t => { t.price = null; t.ph = []; t.tries = 0; });
});

/* ---------- settings, search, sharing, photo ---------- */
const confR = $('confR'), confO = $('confO');
confR.value = Math.round(CONF_MIN * 100); confO.textContent = confR.value + '%';
confR.oninput = () => {
  CONF_MIN = confR.value / 100; confO.textContent = confR.value + '%';
  try { localStorage.setItem('skuConf', CONF_MIN); } catch (e) {}
};
$('zoomR').oninput = e => { try { track.applyConstraints({ advanced: [{ zoom: +e.target.value }] }); } catch (x) {} };

function hit(sku) {
  const d = searchEl.value.replace(/\D/g, '');
  return !d || sku.replace(/\D/g, '').includes(d);
}
searchEl.oninput = () => { render(); renderHunt(); };

$('huntCopy').onclick = async () => {
  if (!hunt.length) return;
  const ok = await copyText(hunt.map(h => h.sku + ' ' + h.price).join('\n'));
  setStatus(ok ? 'Copied ' + hunt.length + ' items' : 'Could not copy.');
};
const imp = $('imp');
$('huntImport').onclick = () => { $('impTxt').value = ''; imp.showModal(); };
$('impNo').onclick = () => imp.close();
$('impGo').onclick = () => {
  let n = 0;
  for (const line of $('impTxt').value.split(/\n/)) {
    const m = /(\d{4})\s*-\s*(\d{3})\D+(\d{1,4}\.\d{2})/.exec(line);
    if (m) { addHunt({ sku: m[1] + '-' + m[2], price: (+m[3]).toFixed(2), done: false }); n++; }
  }
  imp.close(); setStatus('Imported ' + n + ' items');
};

photoBtn.onclick = () => photoIn.click();
photoIn.onchange = async () => {
  const file = photoIn.files[0]; photoIn.value = '';
  if (!file) return;
  if (running) stopCamera();
  setStatus('Reading photo\u2026');
  let n = 0;
  try {
    await Promise.all([initOcr(), initDetector()]);
    if (!ready) return;
    const img = new Image(); img.src = URL.createObjectURL(file); await img.decode();
    const k = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight));
    const pc = document.createElement('canvas');
    pc.width = Math.round(img.naturalWidth * k); pc.height = Math.round(img.naturalHeight * k);
    pc.getContext('2d').drawImage(img, 0, 0, pc.width, pc.height); URL.revokeObjectURL(img.src);
    let boxes = await findTags(pc);
    if (!boxes.length) boxes = await findTags(pc);      // retry once after an automatic model-size fix
    busy = true;
    for (const b of boxes) {
      const t = { ...b };
      t.sku = parseSku(await runOcr(t, 'sku', pc));
      if (!t.sku) continue;
      if (needs(t) === 'price') t.price = parsePrice(await runOcr(t, 'price', pc));
      settle(t); n++;
    }
  } catch (e) { console.error(e); }
  busy = false;
  setStatus(n ? 'Read ' + n + (n === 1 ? ' tag' : ' tags') + ' from the photo.' : 'No tags read. Try a closer, sharper photo.');
};

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

load(); loadHunt(); render(); renderHunt();
})();
</script>
</body>
</html>
